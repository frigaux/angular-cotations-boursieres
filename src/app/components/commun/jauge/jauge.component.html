<div class="conteneur" [ngClass]="{'taille-reduite': tailleReduite}">
  <div class="libelles">
    <span>{{ plusBas  | currency:'EUR':'symbol' }}</span>
    <span>{{ plusHaut  | currency:'EUR':'symbol' }}</span>
  </div>
  <div class="jauge" (click)="tailleReduite && popover.toggle($event)"
       (mouseover)="tailleReduite && popover.show($event)"
       (mouseout)="tailleReduite && popover.hide()">
    @if (pourcentageCours) {
      <div class="pourcentageCours"
           [ngClass]="{'rouge': pourcentageCours < 50, 'vert': pourcentageCours >= 50}"
           [style]="{ width: `${pourcentageCours}%` }"></div>
      <div class="pourcentageOuverture"
           [style]="{ width: `${pourcentageOuverture}%` }"></div>
    }
    <div class="valeur">
      @if (tailleReduite) {
        {{ variationPlusBasPlusHaut | percent:'1.2-2' }}
      } @else {
        {{ cours | currency:'EUR':'symbol' }}
      }
    </div>
  </div>
  <p-popover #popover>{{ tooltip }}</p-popover>
</div>
