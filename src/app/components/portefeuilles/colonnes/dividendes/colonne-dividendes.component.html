<ul class="dividendes" [ngClass]="{'reduit': reduit}">
  @for (dividendeDecore of dividendesDecores; track dividendeDecore.id) {
    <li>
      <span>{{ dividendeDecore.dividende.date  | date: 'MM/yy' }}</span>
      @if (!reduit) {
        <span>{{ dividendeDecore.dividende.montant | currency:'EUR':'symbol' }}</span>
      }
      <span>{{ dividendeDecore.pourcentageDividende | percent:'1.2-2' }}</span>
    </li>
  }
</ul>
